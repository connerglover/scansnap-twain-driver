; Copy next to ScanSnap-iX1300.ds in C:\Windows\twain_32 .
[Driver]
; 1 = append a protocol log to LogFile
LogEnable=0
LogFile=C:\Windows\twain_32\ScanSnapTWAIN.log
; 1 = use the built-in synthetic scanner (no hardware); for testing only
Mock=0
; -1 = probe the colour interleaving per session, 0 = RGB dot, 1 = BGR dot,
; 2 = line interleaved. Leave at -1 unless a page comes back with swapped
; or striped colour.
Interlace=-1
; 1 = ask the scanner to buffer pages (mode page 0x3a). Faster on long jobs,
; needs the batch to be closed properly.
ScannerBuffering=0
; 1 = keep the scanner's raw 1-bit polarity (white = 1). 0 = TWAIN chocolate.
LineartRawPolarity=0
